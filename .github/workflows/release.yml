name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: >
          dotnet publish UnicornOverlord/UnicornOverlord.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Zip artifact
        run: Compress-Archive -Path publish/* -DestinationPath SaveEditUO-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SaveEditUO ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: SaveEditUO-${{ github.ref_name }}.zip
          generate_release_notes: true
